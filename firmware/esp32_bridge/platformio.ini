; =============================================================================
;  Tilts uz rokas: Web UI + pults uztvērējs -> kontrolieris (RAMPS / SKR) caur UART
;
;  Izvēlies vidi pēc savas plates un pults radio:
;    pio run -e espnow    -t upload    ESP32 DevKit (WROOM-32), pults caur ESP-NOW
;    pio run -e lora      -t upload    ESP32 DevKit + SX1276/SX1278 LoRa
;    pio run -e s3_espnow -t upload    ESP32-S3 DevKitC (piem. N16R8), ESP-NOW
;    pio run -e s3_lora   -t upload    ESP32-S3 + LoRa
;    pio run -e d1mini    -t upload    Wemos D1 mini (ESP8266), tikai ESP-NOW
; =============================================================================
[platformio]
default_envs = espnow

[env]
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/embed_web.py
build_flags = -I../common
lib_deps =
  links2004/WebSockets@^2.4.1

[esp32]
platform = espressif32@6.5.0
board = esp32dev
board_build.partitions = min_spiffs.csv

[env:espnow]
extends = esp32
build_flags = ${env.build_flags} -DRC_LINK_ESPNOW

[env:lora]
extends = esp32
build_flags = ${env.build_flags} -DRC_LINK_LORA
lib_deps =
  ${env.lib_deps}
  sandeepmistry/LoRa@^0.8.0

; ESP32-S3 (N16R8: 16 MB flash, 8 MB PSRAM - PSRAM neizmantojam).
; Ielādei un atkļūdošanai izmanto USB ligzdu ar uzrakstu "COM"/"UART".
[s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

[env:s3_espnow]
extends = s3
build_flags = ${env.build_flags} -DRC_LINK_ESPNOW

[env:s3_lora]
extends = s3
build_flags = ${env.build_flags} -DRC_LINK_LORA
lib_deps =
  ${env.lib_deps}
  sandeepmistry/LoRa@^0.8.0

; Wemos D1 mini (ESP8266, 4 MB)
[env:d1mini]
platform = espressif8266
board = d1_mini
upload_speed = 115200
build_flags = ${env.build_flags} -DRC_LINK_ESPNOW
