; =============================================================================
;  Pults: ESP32-S3 (N16R8) Futaba T8J korpusā, ESP-NOW
;    pio run -e s3 -t upload --upload-port COMx     (USB ligzda "COM", CH343)
;    pio run -e s3_ota -t upload --upload-port IP    (pa Wi-Fi caur /update: ieslēdz pulti, turot nefiksējošo
;                                                     pogu; IP mājas tīklā redzams pults ekrānā)
; =============================================================================
[platformio]
default_envs = s3

[env:s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
build_flags = -I../common -DRC_LINK_ESPNOW
lib_deps =
    olikraus/U8g2@^2.35.9
    lovyan03/LovyanGFX@^1.1.16

; Atjaunināšana pa Wi-Fi (korpuss aizvērts): ieslēdz pulti, turot nefiksējošo pogu; IP redzams ekrānā.
; Ielādē caur pults /update lapu (savienojumu veido dators - Windows ugunsmūris netraucē).
;   pio run -e s3_ota -t upload --upload-port 10.20.0.80
[env:s3_ota]
extends = env:s3
upload_protocol = custom
upload_port = 10.20.0.80
upload_command = curl -sS -m 180 -F "update=@$SOURCE" http://$UPLOAD_PORT/update
