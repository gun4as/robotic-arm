; =============================================================================
;  Robot rokas kontrolieris
;  Viens kods diviem kontrolieriem:
;    pio run -e ramps14       -> Arduino Mega 2560 + RAMPS 1.4
;    pio run -e skr14turbo    -> BTT SKR V1.4 Turbo (LPC1769) + TMC2209 UART
; =============================================================================

[platformio]
default_envs = ramps14

[env]
framework = arduino
build_flags = -Wall

[env:ramps14]
platform = atmelavr
board = megaatmega2560
build_flags = ${env.build_flags} -DBOARD_RAMPS14
lib_deps =
  arduino-libraries/Servo@^1.2.1
  arduino-libraries/SD@^1.2.4
monitor_speed = 115200
upload_speed = 115200

; SKR V1.4 Turbo: tā pati platforma, ko izmanto Marlin.
; Linkera skripts jau atstāj 16K bootloaderim, tāpēc firmware.bin
; vienkārši nokopē uz SD kartes un pārstartē plati.
[env:skr14turbo]
platform = https://github.com/p3p/pio-nxplpc-arduino-lpc176x/archive/0.1.3.zip
platform_packages = framework-arduino-lpc176x@^0.2.8
board = nxp_lpc1769
build_flags = ${env.build_flags} -DBOARD_SKR14_TURBO
monitor_speed = 115200
