; Datora būves (MinGW no PlatformIO), bez dzelžiem:
;   pio run -e sim      -> .pio\build\sim\program.exe      (automātiskie testi)
;   pio run -e virtual  -> .pio\build\virtual\program.exe  (virtuālā roka uz TCP 5555)
[env]
platform = windows_x86
build_flags = -DBOARD_RAMPS14 -DSTEPPER_ACC16 -DSIM_BUILD -I../include -Imock -O2 -std=gnu++11

[env:sim]
build_src_filter = +<sim_main.cpp>

[env:virtual]
build_src_filter = +<virtual_main.cpp>
build_flags = ${env.build_flags} -lws2_32 -lwinmm
